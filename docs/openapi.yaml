openapi: 3.0.3
info:
  title: QabulFlow AI API
  version: 1.0.0
  description: O'quv markazlari uchun AI qabul, sotuv va sinov darsiga yozilish tizimi
    API.
paths:
  /api/ai/settings/:
    get:
      operationId: ai_settings_retrieve
      tags:
      - ai
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettings'
          description: ''
    put:
      operationId: ai_settings_update
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AISettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AISettingsRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettings'
          description: ''
    patch:
      operationId: ai_settings_partial_update
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAISettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAISettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAISettingsRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISettings'
          description: ''

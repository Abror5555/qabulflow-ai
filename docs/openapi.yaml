  /api/bookings/:
    get:
      operationId: bookings_list
      description: |-
        get_queryset'ni har doim request.organization bilan cheklaydi.

        organization_field — modeldagi tashkilot maydoniga yo'l.
        branch_field — filial cheklovi uchun yo'l (ixtiyoriy).
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - panel
          - telegram
          - webchat
        description: |-
          * `telegram` - Telegram
          * `webchat` - Veb-chat
          * `panel` - Panel
      - in: query
        name: lead
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - attended
          - cancelled
          - confirmed
          - no_show
        description: |-
          * `confirmed` - Tasdiqlangan
          * `cancelled` - Bekor qilingan
          * `attended` - Qatnashdi
          * `no_show` - Kelmadi
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:

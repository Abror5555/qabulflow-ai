  /api/analytics/details/:
    get:
      operationId: analytics_details_retrieve
      description: Grafik nuqtasi/segmentidan filtrlangan tafsilotlar jadvali (drill-down).
      parameters:
      - in: query
        name: branch_id
        schema:
          type: integer
      - in: query
        name: bucket
        schema:
          type: string
      - in: query
        name: channel
        schema:
          type: string
      - in: query
        name: course_id
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD (tashkilot zonasida)
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD (kiritilgan kun ham kiradi)
      - in: query
        name: detail_course_id
        schema:
          type: integer
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - day
          - week
      - in: query
        name: metric
        schema:
          type: string
        required: true
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - analytics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''

        lead_id:
          type: integer
          readOnly: true
        lead_name:
          type: string
          readOnly: true
        lead_status:
          type: string
          readOnly: true
        lead_status_label:
          type: string
          readOnly: true
        channel:
          $ref: '#/components/schemas/ConversationChannelEnum'
        channel_label:
          type: string
          readOnly: true

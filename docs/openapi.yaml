components:
  schemas:
    AISettings:
      type: object
      properties:
        is_enabled:
          type: boolean
          description: O'chirilsa, barcha yangi suhbatlar operatorga tushadi
        greetings: {}
        enabled_languages: {}
        tone:
          $ref: '#/components/schemas/ToneEnum'
        working_hours:
          $ref: '#/components/schemas/WorkingHours'
        handoff_keywords: {}
        handoff_after_failed_attempts:
          type: integer
          maximum: 5
          minimum: 1
        handoff_outside_hours_notice:
          type: boolean
        ask_phone_before_booking:
          type: boolean
        max_slots_to_offer:
          type: integer
          maximum: 5
          minimum: 1
        reminder_hours_before:
          type: integer
          maximum: 48
          minimum: 1
        provider:
          type: object
          additionalProperties: {}
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - provider
      - updated_at
      - working_hours
    AISettingsRequest:
      type: object
      properties:
        is_enabled:
          type: boolean
          description: O'chirilsa, barcha yangi suhbatlar operatorga tushadi
        greetings: {}
        enabled_languages: {}
        tone:
          $ref: '#/components/schemas/ToneEnum'
        working_hours:
          $ref: '#/components/schemas/WorkingHoursRequest'
        handoff_keywords: {}
        handoff_after_failed_attempts:
          type: integer
          maximum: 5
          minimum: 1
        handoff_outside_hours_notice:
          type: boolean
        ask_phone_before_booking:
          type: boolean
        max_slots_to_offer:
          type: integer
          maximum: 5
          minimum: 1
        reminder_hours_before:
          type: integer
          maximum: 48
          minimum: 1
      required:
      - working_hours
    AiStatusEnum:
      enum:
      - none
      - ok
      - failed
      - skipped_human
      type: string
      description: |-
        * `none` - —
        * `ok` - Javob berildi
        * `failed` - AI xatosi
        * `skipped_human` - Operator rejimi
    AssignRequest:
      type: object
      properties:
        user_id:
          type: integer
          nullable: true
      required:
      - user_id
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/AttachmentKindEnum'
        content_type:
          type: string
          maxLength: 100
        size_bytes:
          type: integer
          maximum: 2147483647
          minimum: 0
        duration_seconds:
          type: number
          format: double
          nullable: true
        download_url:
          type: string
          readOnly: true
      required:
      - content_type
      - download_url
      - id
      - size_bytes
    AttachmentKindEnum:
      enum:
      - voice
      - file
      type: string
      description: |-
        * `voice` - Ovozli xabar
        * `file` - Fayl
    AttendanceRequest:
      type: object
      properties:
        attended:
          type: boolean
      required:
      - attended
    BookingChannelEnum:
      enum:
      - telegram
      - webchat
      - panel
      type: string
      description: |-
        * `telegram` - Telegram
        * `webchat` - Veb-chat
        * `panel` - Panel
    BookingEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        label:
          type: string
          readOnly: true
        actor_type:
          type: string
          maxLength: 16
        actor_name:
          type: string
          readOnly: true
        reason:
          type: string
          maxLength: 255
        occurred_at:
          type: string
          format: date-time
        from_slot_id:
          type: integer
          nullable: true
          readOnly: true
        to_slot_id:
          type: integer
          nullable: true
          readOnly: true
      required:
      - actor_name
      - event_type
      - from_slot_id
      - id
      - label
      - to_slot_id
    BookingStatusEnum:
      enum:
      - confirmed
      - cancelled
      - attended
      - no_show
      type: string
      description: |-
        * `confirmed` - Tasdiqlangan
        * `cancelled` - Bekor qilingan
        * `attended` - Qatnashdi
        * `no_show` - Kelmadi
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        address:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
        groups_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - groups_count
      - id
      - name
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        is_active:
          type: boolean
      required:
      - name
    CancelBookingRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 8
      required:
      - current_password
      - new_password
    ChangedViaEnum:
      enum:
      - ai
      - operator
      - system
      type: string
      description: |-
        * `ai` - AI
        * `operator` - Xodim
        * `system` - Tizim
    ConversationChannelEnum:
      enum:
      - telegram
      - webchat
      - test
      type: string
      description: |-
        * `telegram` - Telegram
        * `webchat` - Veb-chat
        * `test` - AI test-chat
    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        lead_id:
          type: integer
          readOnly: true
        lead_name:
          type: string
          readOnly: true
        lead_status:
          type: string
          readOnly: true
        lead_status_label:
          type: string
          readOnly: true
        channel:
          $ref: '#/components/schemas/ConversationChannelEnum'
        channel_label:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ConversationStatusEnum'
        mode:
          $ref: '#/components/schemas/ModeEnum'
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        language:
          $ref: '#/components/schemas/LanguageEnum'
        needs_attention:
          type: boolean
        last_message_at:
          type: string
          format: date-time
        last_message_preview:
          type: string
          maxLength: 200
        unanswered:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
        handoffs:
          type: array
          items:
            $ref: '#/components/schemas/Handoff'
          readOnly: true
        lead:
          type: object
          additionalProperties: {}
          readOnly: true
        state_summary:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - assigned_to
      - channel
      - channel_label
      - handoffs
      - id
      - lead
      - lead_id
      - lead_name
      - lead_status
      - lead_status_label
      - state_summary
      - unanswered
    ConversationList:
      type: object
